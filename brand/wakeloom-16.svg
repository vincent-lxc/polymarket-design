<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Wakeloom 织迹 16px">
  <!-- 16px 专用：逐像素绘制，外 V 2px 宽，内 V 简化为 1px -->
  <rect width="16" height="16" rx="3" fill="#141416"/>
  <g fill="#FF6A1F">
    <rect x="2" y="4" width="2" height="2"/><rect x="12" y="4" width="2" height="2"/>
    <rect x="3" y="6" width="2" height="2"/><rect x="11" y="6" width="2" height="2"/>
    <rect x="4" y="8" width="2" height="2"/><rect x="10" y="8" width="2" height="2"/>
    <rect x="5" y="10" width="2" height="1"/><rect x="9" y="10" width="2" height="1"/>
    <rect x="6" y="11" width="4" height="2"/>
  </g>
  <g fill="#FFB48A">
    <rect x="6" y="4" width="1" height="2"/><rect x="9" y="4" width="1" height="2"/>
    <rect x="7" y="6" width="2" height="2"/>
  </g>
</svg>
